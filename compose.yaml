# Local dev infra. Only `web` (profile app) publishes a port, on loopback; db/redis use compose.test.yaml for host-run tests.
# Variables come from .env (copy .env.example) or `--env-file .env.example`.
services:
  db:
    image: mariadb:11.8.9
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?set in .env}
      MARIADB_DATABASE: ${MARIADB_DATABASE:?set in .env}
      MARIADB_USER: ${MARIADB_USER:?set in .env}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?set in .env}
    volumes:
      - db-data:/var/lib/mysql
    networks: [internal]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  redis:
    image: redis:8.10.3
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    build:
      context: .
      target: worker
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      DATABASE_URL: mysql://${MARIADB_USER:?set in .env}:${MARIADB_PASSWORD:?set in .env}@db:3306/${MARIADB_DATABASE:?set in .env}
      # NODE_ENV=production refuses `change-me` and tokens under 32 chars: the local stack has its own placeholder.
      READY_TOKEN: ${STACK_READY_TOKEN:?set in .env}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # No real email provider is chosen yet (ADR-10): identity routes answer 503 in containers.
      EMAIL_TRANSPORT: none
      APP_ORIGIN: http://localhost:${WEB_HOST_PORT:-3000}
      # Local stack only: no reverse proxy in front, so every client shares one rate-limit bucket (accepted here).
      TRUST_PROXY_ACK_SINGLE_BUCKET: "true"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [internal]
    healthcheck:
      # The worker touches /tmp/worker-alive every 10 s; unhealthy if the file is older than 30 s.
      test: ["CMD", "node", "-e", "const s=require('fs').statSync('/tmp/worker-alive');process.exit(Date.now()-s.mtimeMs<30000?0:1)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Only service that publishes a port (loopback). Opt-in: `docker compose --profile app up` (pnpm stack:up).
  web:
    profiles: ["app"]
    build:
      context: .
      target: web
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      DATABASE_URL: mysql://${MARIADB_USER:?set in .env}:${MARIADB_PASSWORD:?set in .env}@db:3306/${MARIADB_DATABASE:?set in .env}
      # NODE_ENV=production refuses `change-me` and tokens under 32 chars: the local stack has its own placeholder.
      READY_TOKEN: ${STACK_READY_TOKEN:?set in .env}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # No real email provider is chosen yet (ADR-10): identity routes answer 503 in containers.
      EMAIL_TRANSPORT: none
      APP_ORIGIN: http://localhost:${WEB_HOST_PORT:-3000}
      # Local stack only: no reverse proxy in front, so every client shares one rate-limit bucket (accepted here).
      TRUST_PROXY_ACK_SINGLE_BUCKET: "true"
      STORAGE_LOCAL_DIR: /var/lib/lookiva/storage
    volumes:
      - storage-data:/var/lib/lookiva/storage
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [internal]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

networks:
  internal: {}

volumes:
  db-data: {}
  storage-data: {}
