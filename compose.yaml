# Local dev infra. No ports are published here (see compose.test.yaml for host-run tests).
# Variables come from .env (copy .env.example) or `--env-file .env.example`.
services:
  db:
    image: mariadb:11.8.9
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?set in .env}
      MARIADB_DATABASE: ${MARIADB_DATABASE:?set in .env}
      MARIADB_USER: ${MARIADB_USER:?set in .env}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?set in .env}
    volumes:
      - db-data:/var/lib/mysql
    networks: [internal]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  redis:
    image: redis:8.10.3
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  internal: {}

volumes:
  db-data: {}
