# Local dev infra. No ports are published here (see compose.test.yaml for host-run tests).
# Variables come from .env (copy .env.example) or `--env-file .env.example`.
services:
  db:
    image: mariadb:11.8.9
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?set in .env}
      MARIADB_DATABASE: ${MARIADB_DATABASE:?set in .env}
      MARIADB_USER: ${MARIADB_USER:?set in .env}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?set in .env}
    volumes:
      - db-data:/var/lib/mysql
    networks: [internal]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  redis:
    image: redis:8.10.3
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    build:
      context: .
      target: worker
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      DATABASE_URL: mysql://${MARIADB_USER:?set in .env}:${MARIADB_PASSWORD:?set in .env}@db:3306/${MARIADB_DATABASE:?set in .env}
      READY_TOKEN: ${READY_TOKEN:?set in .env}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [internal]
    healthcheck:
      # The worker touches /tmp/worker-alive every 10 s; unhealthy if the file is older than 30 s.
      test: ["CMD", "node", "-e", "const s=require('fs').statSync('/tmp/worker-alive');process.exit(Date.now()-s.mtimeMs<30000?0:1)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  internal: {}

volumes:
  db-data: {}
