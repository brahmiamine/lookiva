<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوكيفا · الخزانة (نموذج B · Studio)</title>
<style>
:root{
  --color-bg:#F4F6F8;--color-surface:#FFFFFF;--color-text:#14202B;--color-text-muted:#5C6B78;
  --color-primary:#0E5C63;--color-on-primary:#FFFFFF;--color-border:#7A8793;
  --color-tone-success-fg:#16794A;--color-tone-success-bg:#DDF3E8;
  --color-tone-warning-fg:#8A5A00;--color-tone-warning-bg:#FFF1D6;
  --color-tone-danger-fg:#A4262C;--color-tone-danger-bg:#FBE4E4;
  --color-tone-info-fg:#1D5A96;--color-tone-info-bg:#E2EEFA;
  --color-tone-neutral-fg:#3F4D59;--color-tone-neutral-bg:#E6EAEE;
  --font-sans:system-ui,'Segoe UI','Noto Sans Arabic','Geeza Pro',sans-serif;
  --radius-card:12px;--size-touch:44px;
  /* mockup-only: decorative hairline (no meaning carried) and page backdrop */
  --hairline:#DCE2E8;--backdrop:#CDD4DB;
}

*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--backdrop);font-family:var(--font-sans);color:var(--color-text);line-height:1.4;font-size:15px;
  min-block-size:100vh;display:grid;place-items:center;padding-block:24px;padding-inline:16px}
.phone{inline-size:375px;block-size:812px;max-inline-size:100%;background:var(--color-bg);border-radius:36px;
  box-shadow:0 0 0 8px #14202B,0 24px 60px rgba(20,32,43,.28);display:flex;flex-direction:column;position:relative;overflow:hidden}
@media (max-width:440px){body{padding:0;display:block}.phone{block-size:100dvh;border-radius:0;box-shadow:none}}
.scroll{flex:1;overflow-y:auto;padding-inline:16px;padding-block-end:24px}
h1,h2,h3{line-height:1.2}
ul,ol{list-style:none}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--color-primary);outline-offset:2px;border-radius:6px}
.sr{position:absolute;inline-size:1px;block-size:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.ic{inline-size:1em;block-size:1em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
[dir=rtl] .flip{transform:scaleX(-1)}
.muted{color:var(--color-text-muted)}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:20px 12px;padding-inline:16px}
.top h1{font-size:24px;font-weight:800;letter-spacing:-.01em;color:var(--color-primary)}
.top .sub{font-size:14px;color:var(--color-text-muted);font-weight:600}
.back{display:inline-flex;align-items:center;justify-content:center;inline-size:var(--size-touch);block-size:var(--size-touch);
  border-radius:999px;background:var(--color-surface);border:1px solid var(--color-border);font-size:20px}
.top .title{font-size:18px;font-weight:700}

/* pills & chips */
.pill{display:inline-flex;align-items:center;gap:4px;padding-block:3px;padding-inline:8px 10px;border-radius:999px;font-size:12px;font-weight:700;line-height:1.3}
.pill .ic{font-size:14px}
.t-success{color:var(--color-tone-success-fg);background:var(--color-tone-success-bg)}
.t-warning{color:var(--color-tone-warning-fg);background:var(--color-tone-warning-bg)}
.t-danger{color:var(--color-tone-danger-fg);background:var(--color-tone-danger-bg)}
.t-info{color:var(--color-tone-info-fg);background:var(--color-tone-info-bg)}
.t-neutral{color:var(--color-tone-neutral-fg);background:var(--color-tone-neutral-bg)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-block:4px 12px;scrollbar-width:none}
.chip{display:inline-flex;align-items:center;gap:6px;min-block-size:var(--size-touch);padding-inline:14px;border-radius:999px;white-space:nowrap;
  background:var(--color-surface);border:1.5px solid var(--color-border);font-size:14px;font-weight:600}
.chip[aria-pressed=true],.chip.on{background:var(--color-primary);border-color:var(--color-primary);color:var(--color-on-primary)}
.chip .ic{font-size:16px}

/* cards & buttons */
.card{background:var(--color-surface);border:1px solid var(--hairline);border-radius:var(--radius-card);box-shadow:0 1px 2px rgba(20,32,43,.06)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-block-size:48px;padding-inline:18px;border-radius:12px;
  font-size:16px;font-weight:700;border:1.5px solid var(--color-primary);background:var(--color-surface);color:var(--color-primary);inline-size:100%}
.btn.primary{background:var(--color-primary);color:var(--color-on-primary)}
.btn.danger{border-color:var(--color-tone-danger-fg);color:var(--color-tone-danger-fg);background:var(--color-tone-danger-bg)}
.btn.small{min-block-size:var(--size-touch);inline-size:auto;font-size:14px;padding-inline:14px}
.btn .ic{font-size:20px}
.fab{position:absolute;inset-inline-end:16px;inset-block-end:92px;inline-size:auto;border-radius:999px;box-shadow:0 6px 16px rgba(14,92,99,.35)}

/* placeholder photos (illustration colours are decorative, not tokens) */
.ph{background:var(--c,#C9A67A);display:grid;place-items:center;color:rgba(255,255,255,.75);position:relative}
.ph .ic{font-size:44px;stroke-width:1.5}

/* bottom nav */
.nav{margin-inline:12px;margin-block:0 12px;background:var(--color-surface);border:1px solid var(--hairline);border-radius:24px;
  box-shadow:0 4px 14px rgba(20,32,43,.10);display:flex;gap:4px;padding:6px}
.nav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-block-size:52px;border-radius:18px;
  font-size:12px;font-weight:600;color:var(--color-text-muted)}
.nav a .ic{font-size:22px}
.nav a[aria-current=page]{background:var(--color-primary);color:var(--color-on-primary);font-weight:800}
.nav a[aria-current=page] .ic{stroke-width:2.6}

/* section titles */
.sec{margin-block:20px 8px;font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--color-text-muted)}


.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding-block-end:80px}
.item a{display:block;overflow:hidden;border-radius:var(--radius-card)}
.item .ph{aspect-ratio:5/4}
.item .meta{padding:10px 12px 12px;display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.item h3{font-size:15px;font-weight:700}
.item{overflow:hidden}
.item:has(a:focus-visible){outline:3px solid var(--color-primary);outline-offset:2px}
.item a:focus-visible{outline:none}

</style>
</head>
<body>

<symbol id="i-calendar" viewBox="0 0 16 16"><rect x="2.5" y="3.5" width="11" height="10" rx="1.5"/><path d="M2.5 7h11M5.5 2v3M10.5 2v3"/></symbol>
